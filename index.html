<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎙️ AI 실시간 음성 번역기</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        /* 토스트 메시지 스타일 */
        .toast {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 16px 28px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 500;
            z-index: 1000;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast.success {
            background: rgba(76, 175, 80, 0.95);
        }

        .toast.error {
            background: rgba(244, 67, 54, 0.95);
        }

        .toast.recording {
            background: rgba(245, 87, 108, 0.95);
        }

        .toast-icon {
            font-size: 20px;
        }

        .api-section {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 25px;
        }

        .api-section label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .api-section input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .api-section input:focus {
            outline: none;
            border-color: #667eea;
        }

        .language-selector {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 15px;
            align-items: center;
            margin-bottom: 30px;
        }

        .lang-box {
            text-align: center;
        }

        .lang-box label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
            font-weight: 600;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 14px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .swap-btn {
            background: #667eea;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s, background 0.3s;
            font-size: 18px;
            margin-top: 20px;
        }

        .swap-btn:hover {
            background: #5568d3;
            transform: rotate(180deg);
        }

        .mic-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin: 30px 0;
        }

        .mic-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 녹음 중 파형 애니메이션 */
        .sound-waves {
            position: absolute;
            width: 200px;
            height: 200px;
            display: none;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .sound-waves.active {
            display: flex;
        }

        .wave {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid rgba(245, 87, 108, 0.5);
            animation: wave-expand 2s infinite;
            opacity: 0;
        }

        .wave:nth-child(1) { animation-delay: 0s; }
        .wave:nth-child(2) { animation-delay: 0.5s; }
        .wave:nth-child(3) { animation-delay: 1s; }

        @keyframes wave-expand {
            0% {
                transform: scale(0.5);
                opacity: 1;
            }
            100% {
                transform: scale(1.5);
                opacity: 0;
            }
        }

        .mic-button {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 40px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mic-button:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 35px rgba(102, 126, 234, 0.5);
        }

        .mic-button:active {
            transform: scale(0.95);
        }

        .mic-button.recording {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 0 8px 25px rgba(245, 87, 108, 0.5);
            animation: mic-pulse 1.5s infinite;
        }

        @keyframes mic-pulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(245, 87, 108, 0.7);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 0 15px rgba(245, 87, 108, 0);
                transform: scale(1.05);
            }
        }

        .mic-button.processing {
            background: linear-gradient(135deg, #ffd93d 0%, #ff6b6b 100%);
            cursor: wait;
        }

        .timer {
            font-size: 24px;
            font-weight: 700;
            color: #f5576c;
            font-variant-numeric: tabular-nums;
            opacity: 0;
            transition: opacity 0.3s;
            margin-top: 10px;
        }

        .timer.show {
            opacity: 1;
        }

        .status-box {
            background: #f8f9fa;
            padding: 12px 24px;
            border-radius: 20px;
            font-size: 14px;
            color: #666;
            font-weight: 500;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-box.recording {
            background: #ffe5e7;
            color: #f5576c;
        }

        .status-box.processing {
            background: #fff3cd;
            color: #856404;
        }

        .status-icon {
            font-size: 16px;
        }

        .result-container {
            margin-top: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 20px;
            min-height: 150px;
            display: none;
        }

        .result-container.show {
            display: block;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-label {
            font-size: 12px;
            color: #667eea;
            font-weight: 700;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .result-text {
            font-size: 17px;
            color: #333;
            line-height: 1.6;
            margin-bottom: 15px;
            padding: 15px;
            background: white;
            border-radius: 12px;
            border-left: 4px solid #667eea;
            word-break: keep-all;
        }

        .translated-text {
            border-left-color: #764ba2;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            color: #f5576c;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
            background: #ffe5e7;
            padding: 10px;
            border-radius: 10px;
            display: none;
        }

        .error.show {
            display: block;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .info-box {
            margin-top: 20px;
            padding: 15px;
            background: #e3f2fd;
            border-radius: 12px;
            font-size: 13px;
            color: #1976d2;
            line-height: 1.5;
        }

        .play-btn {
            background: #4caf50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            margin-top: 10px;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .play-btn:hover {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
        }

        .lang-detected {
            display: inline-block;
            padding: 4px 12px;
            background: #667eea;
            color: white;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .shortcut-hint {
            text-align: center;
            font-size: 12px;
            color: #999;
            margin-top: 15px;
        }

        kbd {
            background: #eee;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: monospace;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <!-- 토스트 메시지 -->
    <div class="toast" id="toast">
        <span class="toast-icon" id="toastIcon">ℹ️</span>
        <span id="toastMessage">메시지</span>
    </div>

    <div class="container">
        <h1>🌐 AI 음성 번역기</h1>
        <p class="subtitle">버튼을 눌러 녹음을 시작하고, 다시 눌러 번역을 실행하세요</p>

        <div class="api-section">
            <label>OpenAI API 키</label>
            <input type="password" id="apiKey" placeholder="sk-..." />
        </div>

        <div class="language-selector">
            <div class="lang-box">
                <label>내 언어 (입력)</label>
                <select id="sourceLang">
                    <option value="auto">자동 감지</option>
                    <option value="ko">한국어</option>
                    <option value="en">English</option>
                    <option value="ja">日本語</option>
                    <option value="zh">中文</option>
                    <option value="es">Español</option>
                    <option value="fr">Français</option>
                    <option value="de">Deutsch</option>
                    <option value="ru">Русский</option>
                    <option value="it">Italiano</option>
                    <option value="pt">Português</option>
                    <option value="vi">Tiếng Việt</option>
                    <option value="th">ไทย</option>
                    <option value="ar">العربية</option>
                    <option value="hi">हिन्दी</option>
                </select>
            </div>

            <button class="swap-btn" onclick="swapLanguages()" title="언어 교환">⇄</button>

            <div class="lang-box">
                <label>상대방 언어 (출력)</label>
                <select id="targetLang">
                    <option value="en" selected>English</option>
                    <option value="ko">한국어</option>
                    <option value="ja">日本語</option>
                    <option value="zh">中文</option>
                    <option value="es">Español</option>
                    <option value="fr">Français</option>
                    <option value="de">Deutsch</option>
                    <option value="ru">Русский</option>
                    <option value="it">Italiano</option>
                    <option value="pt">Português</option>
                    <option value="vi">Tiếng Việt</option>
                    <option value="th">ไทย</option>
                    <option value="ar">العربية</option>
                    <option value="hi">हिन्दी</option>
                </select>
            </div>
        </div>

        <div class="mic-wrapper">
            <div class="mic-container">
                <!-- 녹음 중 파형 애니메이션 -->
                <div class="sound-waves" id="soundWaves">
                    <div class="wave"></div>
                    <div class="wave"></div>
                    <div class="wave"></div>
                </div>

                <button class="mic-button" id="micBtn" onclick="toggleRecording()">
                    🎤
                </button>
            </div>

            <div class="timer" id="timer">00:00</div>

            <div class="status-box" id="statusBox">
                <span class="status-icon" id="statusIcon">🎙️</span>
                <span id="statusText">버튼을 눌러 녹음 시작</span>
            </div>
        </div>

        <div class="error" id="error"></div>

        <div class="result-container" id="resultContainer">
            <div class="result-label">인식된 내용</div>
            <div class="lang-detected" id="detectedLang" style="display:none;"></div>
            <div class="result-text" id="sourceText"></div>

            <div class="result-label">번역 결과</div>
            <div class="result-text translated-text" id="translatedText"></div>

            <button class="play-btn" onclick="playTranslatedAudio()">
                🔊 번역 음성 다시 듣기
            </button>
        </div>

        <div class="info-box">
            💡 <strong>사용 방법:</strong><br>
            1. OpenAI API 키를 입력하세요<br>
            2. 🎤 버튼을 <strong>한 번 누르면</strong> 녹음 시작<br>
            3. <strong>다시 누르면</strong> 녹음 종료 및 자동 번역<br>
            4. 번역된 음성이 자동으로 재생됩니다
        </div>

        <div class="shortcut-hint">
            단축키: <kbd>Space</kbd> 키로 녹음 시작/종료
        </div>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        let audioBlob = null;
        let translatedAudioUrl = null;
        let currentTranslatedText = '';
        let recordingTimer = null;
        let seconds = 0;

        // 언어 이름 매핑
        const langNames = {
            'ko': '한국어', 'en': 'English', 'ja': '日本語', 'zh': '中文',
            'es': 'Español', 'fr': 'Français', 'de': 'Deutsch', 'ru': 'Русский',
            'it': 'Italiano', 'pt': 'Português', 'vi': 'Tiếng Việt', 'th': 'ไทย',
            'ar': 'العربية', 'hi': 'हिन्दी'
        };

        // 토스트 메시지 표시
        function showToast(message, type = 'info', duration = 3000) {
            const toast = document.getElementById('toast');
            const toastIcon = document.getElementById('toastIcon');
            const toastMessage = document.getElementById('toastMessage');

            toastMessage.textContent = message;

            // 타입별 아이콘 및 스타일
            const icons = {
                'info': 'ℹ️',
                'success': '✅',
                'error': '❌',
                'recording': '🔴'
            };

            toastIcon.textContent = icons[type] || 'ℹ️';
            toast.className = 'toast show ' + type;

            if (duration > 0) {
                setTimeout(() => {
                    toast.classList.remove('show');
                }, duration);
            }

            return toast;
        }

        // 토스트 숨기기
        function hideToast() {
            document.getElementById('toast').classList.remove('show');
        }

        // 에러 표시
        function showError(msg) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = msg;
            errorDiv.classList.add('show');
            showToast(msg, 'error', 5000);

            setTimeout(() => {
                errorDiv.classList.remove('show');
            }, 5000);
        }

        // 언어 교환
        function swapLanguages() {
            const source = document.getElementById('sourceLang');
            const target = document.getElementById('targetLang');
            const temp = source.value;
            source.value = target.value;
            target.value = temp;

            showToast('언어가 교환되었습니다', 'success', 2000);
        }

        // 타이머 포맷
        function formatTime(sec) {
            const mins = Math.floor(sec / 60).toString().padStart(2, '0');
            const secs = (sec % 60).toString().padStart(2, '0');
            return `${mins}:${secs}`;
        }

        // 타이머 시작
        function startTimer() {
            seconds = 0;
            const timerEl = document.getElementById('timer');
            timerEl.textContent = '00:00';
            timerEl.classList.add('show');

            recordingTimer = setInterval(() => {
                seconds++;
                timerEl.textContent = formatTime(seconds);
            }, 1000);
        }

        // 타이머 중지
        function stopTimer() {
            clearInterval(recordingTimer);
            document.getElementById('timer').classList.remove('show');
        }

        // 상태 업데이트
        function updateStatus(state) {
            const statusBox = document.getElementById('statusBox');
            const statusText = document.getElementById('statusText');
            const statusIcon = document.getElementById('statusIcon');
            const micBtn = document.getElementById('micBtn');
            const soundWaves = document.getElementById('soundWaves');

            switch(state) {
                case 'idle':
                    statusBox.className = 'status-box';
                    statusText.textContent = '버튼을 눌러 녹음 시작';
                    statusIcon.textContent = '🎙️';
                    micBtn.innerHTML = '🎤';
                    micBtn.classList.remove('recording', 'processing');
                    soundWaves.classList.remove('active');
                    break;

                case 'recording':
                    statusBox.className = 'status-box recording';
                    statusText.textContent = '🔴 녹음 중... (버튼을 다시 눌러 종료)';
                    statusIcon.textContent = '⏹️';
                    micBtn.innerHTML = '⏹️';
                    micBtn.classList.add('recording');
                    micBtn.classList.remove('processing');
                    soundWaves.classList.add('active');
                    break;

                case 'processing':
                    statusBox.className = 'status-box processing';
                    statusText.innerHTML = '처리 중... <span class="loading"></span>';
                    statusIcon.textContent = '⚙️';
                    micBtn.innerHTML = '⏳';
                    micBtn.classList.remove('recording');
                    micBtn.classList.add('processing');
                    soundWaves.classList.remove('active');
                    break;
            }
        }

        // 녹음 토글
        async function toggleRecording() {
            if (!isRecording) {
                await startRecording();
            } else {
                await stopRecording();
            }
        }

        // 녹음 시작
        async function startRecording() {
            const apiKey = document.getElementById('apiKey').value.trim();
            if (!apiKey) {
                showError('OpenAI API 키를 입력해주세요');
                document.getElementById('apiKey').focus();
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = async () => {
                    audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    // 스트림 정리
                    stream.getTracks().forEach(track => track.stop());
                    // 처리 시작
                    await processAudio();
                };

                mediaRecorder.start(100); // 100ms 간격으로 데이터 수집
                isRecording = true;

                // UI 업데이트
                updateStatus('recording');
                startTimer();
                showToast('녹음이 시작되었습니다', 'recording', 0); // 지속 표시

            } catch (err) {
                showError('마이크 접근 권한이 필요합니다: ' + err.message);
            }
        }

        // 녹음 중지
        async function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;

                // UI 업데이트
                stopTimer();
                updateStatus('processing');
                hideToast();
                showToast('녹음 종료! 번역 처리 중...', 'info', 0);
            }
        }

        // 오디오 처리 (Whisper + GPT + TTS)
        async function processAudio() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const sourceLang = document.getElementById('sourceLang').value;
            const targetLang = document.getElementById('targetLang').value;

            try {
                // 1. Whisper로 음성을 텍스트로 변환
                const formData = new FormData();
                formData.append('file', audioBlob, 'audio.webm');
                formData.append('model', 'whisper-1');
                if (sourceLang !== 'auto') {
                    formData.append('language', sourceLang);
                }

                const whisperRes = await fetch('https://api.openai.com/v1/audio/transcriptions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: formData
                });

                if (!whisperRes.ok) {
                    throw new Error('음성 인식 실패: ' + await whisperRes.text());
                }

                const whisperData = await whisperRes.json();
                const recognizedText = whisperData.text;
                const detectedLang = whisperData.language || sourceLang;

                if (!recognizedText.trim()) {
                    throw new Error('음성을 인식하지 못했습니다. 다시 시도해주세요.');
                }

                // 2. GPT-4로 번역
                const targetLangName = langNames[targetLang] || targetLang;
                const translateRes = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'gpt-4o-mini',
                        messages: [
                            {
                                role: 'system',
                                content: `You are a professional translator. Translate the following text to ${targetLangName}. Only return the translated text, no explanations, no quotation marks.`
                            },
                            {
                                role: 'user',
                                content: recognizedText
                            }
                        ],
                        temperature: 0.3
                    })
                });

                if (!translateRes.ok) {
                    throw new Error('번역 실패: ' + await translateRes.text());
                }

                const translateData = await translateRes.json();
                currentTranslatedText = translateData.choices[0].message.content;

                // 3. TTS로 음성 생성
                const ttsRes = await fetch('https://api.openai.com/v1/audio/speech', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'tts-1',
                        input: currentTranslatedText,
                        voice: 'alloy',
                        response_format: 'mp3'
                    })
                });

                if (!ttsRes.ok) {
                    throw new Error('음성 생성 실패: ' + await ttsRes.text());
                }

                const audioData = await ttsRes.blob();

                // 이전 URL 정리
                if (translatedAudioUrl) {
                    URL.revokeObjectURL(translatedAudioUrl);
                }
                translatedAudioUrl = URL.createObjectURL(audioData);

                // 결과 표시
                displayResults(recognizedText, currentTranslatedText, detectedLang);

                // 상태 복원 및 성공 메시지
                updateStatus('idle');
                hideToast();
                showToast('번역 완료!', 'success', 3000);

                // 자동 재생
                setTimeout(() => playTranslatedAudio(), 500);

            } catch (err) {
                showError('오류: ' + err.message);
                updateStatus('idle');
                hideToast();
            }
        }

        // 결과 표시
        function displayResults(source, translated, detected) {
            document.getElementById('sourceText').textContent = source;
            document.getElementById('translatedText').textContent = translated;

            const langDiv = document.getElementById('detectedLang');
            if (detected && detected !== 'auto') {
                langDiv.textContent = `감지된 언어: ${langNames[detected] || detected}`;
                langDiv.style.display = 'inline-block';
            } else {
                langDiv.style.display = 'none';
            }

            document.getElementById('resultContainer').classList.add('show');

            // 결과 영역으로 스크롤
            document.getElementById('resultContainer').scrollIntoView({
                behavior: 'smooth',
                block: 'nearest'
            });
        }

        // 번역된 음성 재생
        function playTranslatedAudio() {
            if (translatedAudioUrl) {
                const audio = new Audio(translatedAudioUrl);
                audio.play().catch(err => {
                    showToast('음성 재생 실패: ' + err.message, 'error');
                });
            } else {
                showToast('재생할 음성이 없습니다', 'error');
            }
        }

        // 키보드 단축키 (Spacebar로 녹음 토글)
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT') {
                e.preventDefault();
                toggleRecording();
            }
        });

        // API 키 로컬 저장 (선택적)
        document.getElementById('apiKey').addEventListener('change', (e) => {
            if (e.target.value) {
                localStorage.setItem('openai_api_key', e.target.value);
            }
        });

        // 페이지 로드 시 저장된 API 키 복원
        window.addEventListener('load', () => {
            const savedKey = localStorage.getItem('openai_api_key');
            if (savedKey) {
                document.getElementById('apiKey').value = savedKey;
            }
        });

        // 페이지 언로드시 URL 정리
        window.addEventListener('beforeunload', () => {
            if (translatedAudioUrl) {
                URL.revokeObjectURL(translatedAudioUrl);
            }
        });
    </script>
</body>
</html>
